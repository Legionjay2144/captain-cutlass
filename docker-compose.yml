services:
  ollama:
    image: ollama/ollama:latest
    container_name: captain-cutlass-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  captain-cutlass:
    image: captain-cutlass:latest
    build: .
    container_name: captain-cutlass
    init: true
    restart: unless-stopped
    depends_on:
      - ollama

    env_file:
      - .env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AI_PROVIDER: ${AI_PROVIDER:-local-first}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-llama3.2}
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://ollama:11434/v1}
      LOCAL_AI_API_KEY: ${LOCAL_AI_API_KEY:-ollama}
      LOCAL_AI_MAX_OUTPUT_TOKENS: ${LOCAL_AI_MAX_OUTPUT_TOKENS:-}
      LOCAL_AI_CONTEXT_TOKENS: ${LOCAL_AI_CONTEXT_TOKENS:-}
      LOCAL_AI_TEMPERATURE: ${LOCAL_AI_TEMPERATURE:-0.7}

    volumes:
      - ./data:/app/data

volumes:
  ollama:
