services:
  ollama:
    image: ollama/ollama:latest
    container_name: captain-cutlass-ollama
    restart: unless-stopped
    profiles:
      - local-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  captain-cutlass:
    image: captain-cutlass:latest
    build: .
    container_name: captain-cutlass
    init: true
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-none}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}

    volumes:
      - ./data:/app/data

volumes:
  ollama:
